"$schema" = 'https://starship.rs/config-schema.json'
# Two-line prompt: context on line 1, a bare ❯ on line 2. Needs a Nerd Font (JetBrainsMono Nerd Font).

add_newline = true
command_timeout = 1000

format = """
$directory\
$git_branch\
$git_status\
$kubernetes\
$gcloud\
$aws\
$terraform\
$helm\
$golang\
$nodejs\
$python\
$cmd_duration
$character"""

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold yellow)'

[directory]
truncation_length = 3
truncate_to_repo = true
style = 'bold cyan'
read_only = ' 󰌾'

[git_branch]
symbol = ' '
style = 'bold purple'

[git_status]
style = 'bold red'
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'

[kubernetes]
disabled = false
symbol = '󱃾 '
style = 'bold blue'
format = '[$symbol$context( \($namespace\))]($style) '

[gcloud]
symbol = '󱇶 '
format = '[$symbol$project]($style) '
style = 'bold yellow'
disabled = true   # set false if you want the active gcloud project shown

[aws]
symbol = '󰸏 '
format = '[$symbol($profile )(\($region\) )]($style)'
style = 'bold yellow'

[terraform]
symbol = '󱁢 '
format = '[$symbol$workspace]($style) '

[helm]
format = '[$symbol($version )]($style)'

[golang]
format = '[$symbol($version )]($style)'

[nodejs]
format = '[$symbol($version )]($style)'

[python]
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[cmd_duration]
min_time = 2000
format = '[took $duration]($style) '
style = 'yellow'
