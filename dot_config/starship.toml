"$schema" = 'https://starship.rs/config-schema.json'
# Pastel powerline: joined segments with arrow separators and rounded end caps, single line, ❯ after.
#   os  dir  git  kubernetes  [language]
# Three colour blocks: pink (os) | peach (dir | git) | yellow (kubernetes | language). Git and language
# live in conditional groups ( ... ) with a thin divider, so their slots vanish entirely when empty.
# Nerd Font glyphs are written as \u escapes (basic strings) so they survive any editor/tool that
# strips private-use characters. Needs a Nerd Font (JetBrainsMono Nerd Font Mono).
#    = left round cap    = arrow    = right round cap
#    = apple   = ubuntu   = linux   = windows   = git branch
#   \U000F10FE = kubernetes   = node  \U000F1062 = terraform  \U000F033E = lock

add_newline = true
command_timeout = 1000
palette = 'pastel'

format = """
[](pink)\
$os\
[](fg:pink bg:peach)\
$directory\
([](fg:ink bg:peach)\
$git_branch\
$git_status)\
[](fg:peach bg:yellow)\
$kubernetes\
([](fg:ink bg:yellow)\
$golang\
$nodejs\
$python\
$helm\
$terraform)\
[](fg:yellow) \
$cmd_duration\
$character"""

[palettes.pastel]
pink    = '#F5A9B8'
peach   = '#F9B384'
yellow  = '#F6E27F'
green   = '#A8E6A1'
ink     = '#1E1E2E'
grey    = '#6C7086'

[character]
success_symbol = '[❯](bold pink)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold yellow)'

[os]
disabled = false
style = 'bg:pink fg:ink'
format = '[ $symbol ]($style)'
[os.symbols]
Macos = ""
Ubuntu = ""
Linux = ""
Windows = ""

[directory]
style = 'bg:peach fg:ink'
format = '[ $path ]($style)[$read_only]($read_only_style)'
truncation_length = 3
truncate_to_repo = true
read_only = "\U000F033E "
read_only_style = 'bg:peach fg:red'

[git_branch]
style = 'bg:peach fg:ink'
symbol = " "
format = '[ $symbol$branch ]($style)'

[git_status]
style = 'bg:peach fg:ink'
format = '[($all_status$ahead_behind )]($style)'
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
conflicted = '='
untracked = '?${count}'
stashed = '$'
modified = '!${count}'
staged = '+${count}'
renamed = '»'
deleted = '✘${count}'

[kubernetes]
disabled = false
style = 'bg:yellow fg:ink'
symbol = "\U000F10FE "
format = '[ $symbol$context( $namespace) ]($style)'
[[kubernetes.contexts]]
context_pattern = 'arn:aws:eks:[^:]+:\d+:cluster/(?P<name>[\w-]+)'
context_alias = '$name'
[[kubernetes.contexts]]
context_pattern = 'kind-(?P<name>[\w-]+)'
context_alias = 'kind:$name'

# language / tool segments: only inside a matching project
[golang]
style = 'bg:yellow fg:ink'
format = '[ $symbol($version) ]($style)'
[nodejs]
style = 'bg:yellow fg:ink'
symbol = " "
format = '[ $symbol($version) ]($style)'
[python]
style = 'bg:yellow fg:ink'
format = '[ ${symbol}${pyenv_prefix}(${version} )(\($virtualenv\)) ]($style)'
[helm]
style = 'bg:yellow fg:ink'
format = '[ $symbol($version) ]($style)'
[terraform]
style = 'bg:yellow fg:ink'
symbol = "\U000F1062 "
format = '[ $symbol$workspace ]($style)'

[cmd_duration]
min_time = 2000
style = 'grey'
format = '[$duration ]($style)'

[time]
disabled = true
[aws]
disabled = true
[gcloud]
disabled = true
